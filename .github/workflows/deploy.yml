name: Publicar no GitHub Pages

# Roda a cada push na main, e também no botão "Run workflow" da aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões que o deploy do Pages exige.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; se alguém empurrar duas vezes seguidas, vale o último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        env:
          # O Pages publica em https://USUARIO.github.io/NOME-DO-REPO/ —
          # sem este prefixo o CSS e o JS não carregam.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Estas duas são públicas por natureza: ficam dentro do JS do site.
          # Quem protege os dados é o RLS do banco, não o segredo da chave.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Impedir o Jekyll de comer a pasta _next
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
